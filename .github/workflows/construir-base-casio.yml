name: Construir base de búsqueda Casio

on:
  schedule:
    # Lunes 9:00 AM hora Chile (12:00 UTC)
    - cron: '0 12 * * 1'
  workflow_dispatch:        # botón "Run workflow" para probar a mano

permissions:
  contents: write           # necesario para commitear catalogo.json de vuelta

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 60     # la primera corrida analiza 943 fotos

    steps:
      - name: Bajar el repo
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Construir la base
        env:
          ODOO_USERNAME:     ${{ secrets.ODOO_USERNAME }}
          ODOO_PASSWORD:     ${{ secrets.ODOO_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm install
          node construir-base.js

      - name: Guardar catalogo.json en el repo
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@github.com"
          git add catalogo.json fotos 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Actualizar base de búsqueda [skip ci]"
          git push
